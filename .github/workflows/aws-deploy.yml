name: Deploy to AWS Lambda

# Triggers:
#   - Every push to main that changes anything the Lambda image cares about
#   - Manual run via the Actions tab (workflow_dispatch)
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "requirements.txt"
      - "Dockerfile.lambda"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:

# OIDC requires id-token: write. The default permissions don't include it.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: expense-tracker-dev-api
  LAMBDA_FUNCTION_NAME: expense-tracker-dev-api
  # ARN of the OIDC-assumable role created by Terraform in expense-tracker-infra.
  # Not really a secret - the security boundary is the OIDC trust policy on
  # the role itself, which restricts who can assume it to this repo's main /
  # PR refs. We expose it in plain text to make the workflow self-contained.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::497011018096:role/expense-tracker-dev-github-actions-deploy

jobs:
  # Re-run the same checks CI already covers, just to be defensive: if anything
  # is broken we never push a broken image to ECR or update the live Lambda.
  pre-deploy-tests:
    name: Lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense_tracker
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run alembic against Postgres
        run: alembic upgrade head

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-fail-under=70

  deploy:
    name: Build, push to ECR and update Lambda
    runs-on: ubuntu-latest
    needs: [pre-deploy-tests]

    steps:
      - uses: actions/checkout@v4

      # Short-lived AWS credentials. The role is the one Terraform created
      # in expense-tracker-infra/github_actions.tf - its trust policy only
      # lets THIS repo on main / PRs assume it.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the Lambda image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI_TAGGED="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          IMAGE_URI_LATEST="${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          # --provenance=false / --sbom=false produce a plain Docker v2 manifest;
          # Lambda doesn't yet support OCI multi-platform manifest lists with
          # attestations.
          docker build \
            --provenance=false \
            --sbom=false \
            --platform linux/amd64 \
            -f Dockerfile.lambda \
            -t "$IMAGE_URI_TAGGED" \
            -t "$IMAGE_URI_LATEST" \
            .

          echo "image_uri=$IMAGE_URI_TAGGED" >> "$GITHUB_OUTPUT"
          echo "image_uri_latest=$IMAGE_URI_LATEST" >> "$GITHUB_OUTPUT"

      - name: Push image to ECR
        run: |
          docker push "${{ steps.build.outputs.image_uri }}"
          docker push "${{ steps.build.outputs.image_uri_latest }}"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ steps.build.outputs.image_uri }}"

      - name: Wait for Lambda update to settle
        run: |
          aws lambda wait function-updated \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: Smoke-test new deployment (warm + assert 200)
        run: |
          aws lambda invoke \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"version":"2.0","routeKey":"GET /api/v1/ping","rawPath":"/api/v1/ping","rawQueryString":"","headers":{"accept":"*/*"},"requestContext":{"accountId":"x","apiId":"x","domainName":"x","http":{"method":"GET","path":"/api/v1/ping","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"ci-smoke-test"},"requestId":"smoke","routeKey":"GET /api/v1/ping","stage":"$default","time":"01/Jan/2026:00:00:00 +0000","timeEpoch":1735689600},"isBase64Encoded":false}' \
            --cli-read-timeout 120 \
            response.json

          echo "Lambda response:"
          cat response.json
          echo

          STATUS=$(python3 -c "import sys,json; print(json.load(open('response.json')).get('statusCode',0))")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed - Lambda returned statusCode $STATUS"
            exit 1
          fi
          echo "Smoke test passed: statusCode 200"
